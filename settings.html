<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2d2d2d; color: #e6e6e6; font: 13px/1.45 "Segoe UI", "Microsoft YaHei UI", sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; min-height: 100%; box-sizing: border-box; }
    #bar { flex: 0 0 36px; height: 36px; display: flex; align-items: center; padding: 0 8px 0 14px; background: #3a3a3a; -webkit-app-region: drag; user-select: none; }
    #bar h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; flex: 1; }
    #bar button { -webkit-app-region: no-drag; width: 40px; height: 36px; border: 0; background: transparent; color: #ddd; cursor: pointer; }
    #bar button:hover { background: #e81123; color: #fff; }
    #wrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px 16px 8px; }
    .hint { color: #9a9a9a; font-size: 12px; margin: 0 0 14px; }
    .group { margin-bottom: 16px; }
    .group h2 { margin: 0 0 8px; font-size: 12px; color: #18a497; font-weight: 600; }
    .items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
    label:hover { background: #3a3a3a; }
    input { accent-color: #18a497; width: 14px; height: 14px; }
    .ext { color: #888; font-size: 11px; margin-left: auto; }
    #foot { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 16px 14px; background: #252525; border-top: 1px solid #3f3f3f; box-sizing: border-box; }
    #foot .spacer { flex: 1; min-width: 8px; }
    .btn { height: 32px; padding: 0 14px; border: 0; border-radius: 4px; cursor: pointer; font: inherit; color: #eee; background: #4a4a4a; white-space: nowrap; }
    .btn:hover { background: #585858; }
    .btn-primary { background: #18a497; color: #0c1f1c; font-weight: 600; }
    .btn-primary:hover { background: #1bb8a9; }
    .status { font-size: 12px; color: #18a497; min-height: 1em; }
  </style>
</head>
<body>
  <div id="bar">
    <h1 data-i18n="title">File Format Associations</h1>
    <button id="close" data-i18n-title="close" title="Close">✕</button>
  </div>
  <div id="wrap">
    <p class="hint" data-i18n="hint"></p>
    <div id="groups"></div>
  </div>
  <div id="foot">
    <button class="btn" id="all" data-i18n="all">Select all</button>
    <button class="btn" id="none" data-i18n="none">Select none</button>
    <button class="btn" id="reset" data-i18n="reset">Reset default</button>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="btn btn-primary" id="save" data-i18n="save">Save & associate</button>
  </div>
  <script>
    const root = document.getElementById('groups');
    const checks = [];
    let strings = {};
    let selected = [];
    let groups = [];

    const S = (k) => strings[k] || k;

    function applyChrome() {
      document.documentElement.lang = document.documentElement.dataset.lang || 'en';
      document.documentElement.dir = document.documentElement.dataset.rtl === '1' ? 'rtl' : 'ltr';
      document.title = S('title');
      for (const el of document.querySelectorAll('[data-i18n]')) {
        el.textContent = S(el.getAttribute('data-i18n'));
      }
      for (const el of document.querySelectorAll('[data-i18n-title]')) {
        el.title = S(el.getAttribute('data-i18n-title'));
      }
      for (const h of root.querySelectorAll('h2[data-title-key]')) {
        h.textContent = S(h.getAttribute('data-title-key'));
      }
    }

    function renderGroups() {
      root.innerHTML = '';
      checks.length = 0;
      for (const g of groups) {
        const box = document.createElement('div');
        box.className = 'group';
        const h2 = document.createElement('h2');
        h2.setAttribute('data-title-key', g.titleKey || ('group.' + g.id));
        h2.textContent = S(h2.getAttribute('data-title-key'));
        box.append(h2);
        const items = document.createElement('div');
        items.className = 'items';
        for (const it of g.items) {
          const lab = document.createElement('label');
          const inp = document.createElement('input');
          inp.type = 'checkbox';
          inp.value = it.ext;
          inp.checked = selected.includes(it.ext);
          checks.push(inp);
          lab.append(inp, document.createTextNode(it.name));
          const ext = document.createElement('span');
          ext.className = 'ext';
          ext.textContent = '.' + it.ext;
          lab.append(ext);
          items.append(lab);
        }
        box.append(items);
        root.append(box);
      }
    }

    function applyBundle(bundle) {
      if (!bundle || !bundle.strings) return;
      strings = bundle.strings;
      document.documentElement.dataset.lang = bundle.lang || 'en';
      document.documentElement.dataset.rtl = bundle.rtl ? '1' : '0';
      applyChrome();
    }

    window.assoc.load().then((state) => {
      groups = state.groups || [];
      selected = state.selected || [];
      applyBundle(state.i18n);
      renderGroups();

      const setAll = (on) => checks.forEach((c) => { c.checked = on; });
      document.getElementById('all').onclick = () => setAll(true);
      document.getElementById('none').onclick = () => setAll(false);
      document.getElementById('reset').onclick = () => {
        checks.forEach((c) => { c.checked = c.value === 'psd'; });
      };
      document.getElementById('close').onclick = () => window.assoc.close();
      document.getElementById('save').onclick = async () => {
        const exts = checks.filter((c) => c.checked).map((c) => c.value);
        document.getElementById('status').textContent = S('saving');
        await window.assoc.save(exts);
        document.getElementById('status').textContent = S('saved');
        setTimeout(() => { document.getElementById('status').textContent = ''; }, 1600);
      };
    });

    window.assoc.onLang((bundle) => {
      applyBundle(bundle);
    });
  </script>
</body>
</html>
