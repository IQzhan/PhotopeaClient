<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文件关联</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2d2d2d; color: #e6e6e6; font: 13px/1.45 "Segoe UI", "Microsoft YaHei UI", sans-serif; overflow: hidden; }
    #bar { height: 36px; display: flex; align-items: center; padding: 0 8px 0 14px; background: #3a3a3a; -webkit-app-region: drag; user-select: none; }
    #bar h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; flex: 1; }
    #bar button { -webkit-app-region: no-drag; width: 40px; height: 36px; border: 0; background: transparent; color: #ddd; cursor: pointer; }
    #bar button:hover { background: #e81123; color: #fff; }
    #wrap { height: calc(100% - 36px - 56px); overflow: auto; padding: 14px 16px 8px; }
    .hint { color: #9a9a9a; font-size: 12px; margin: 0 0 14px; }
    .group { margin-bottom: 16px; }
    .group h2 { margin: 0 0 8px; font-size: 12px; color: #18a497; font-weight: 600; }
    .items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
    label:hover { background: #3a3a3a; }
    input { accent-color: #18a497; width: 14px; height: 14px; }
    .ext { color: #888; font-size: 11px; margin-left: auto; }
    #foot { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #252525; border-top: 1px solid #3f3f3f; }
    #foot .spacer { flex: 1; }
    .btn { height: 30px; padding: 0 14px; border: 0; border-radius: 4px; cursor: pointer; font: inherit; color: #eee; background: #4a4a4a; }
    .btn:hover { background: #585858; }
    .btn-primary { background: #18a497; color: #0c1f1c; font-weight: 600; }
    .btn-primary:hover { background: #1bb8a9; }
    .status { font-size: 12px; color: #18a497; min-height: 1em; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>文件格式绑定</h1>
    <button id="close" title="关闭">✕</button>
  </div>
  <div id="wrap">
    <p class="hint">勾选后，双击对应后缀会用本程序打开。取消勾选会解除本程序的关联。默认仅绑定 PSD。</p>
    <div id="groups"></div>
  </div>
  <div id="foot">
    <button class="btn" id="all">全选</button>
    <button class="btn" id="none">全不选</button>
    <button class="btn" id="reset">恢复默认</button>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="btn btn-primary" id="save">保存并绑定</button>
  </div>
  <script>
    const root = document.getElementById('groups');
    const checks = [];

    window.assoc.load().then(({ groups, selected }) => {
    for (const g of groups) {
      const box = document.createElement('div');
      box.className = 'group';
      box.innerHTML = `<h2>${g.title}</h2>`;
      const items = document.createElement('div');
      items.className = 'items';
      for (const it of g.items) {
        const lab = document.createElement('label');
        const inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.value = it.ext;
        inp.checked = selected.includes(it.ext);
        checks.push(inp);
        lab.append(inp, document.createTextNode(it.name));
        const ext = document.createElement('span');
        ext.className = 'ext';
        ext.textContent = '.' + it.ext;
        lab.append(ext);
        items.append(lab);
      }
      box.append(items);
      root.append(box);
    }

    const setAll = (on) => checks.forEach((c) => { c.checked = on; });
    document.getElementById('all').onclick = () => setAll(true);
    document.getElementById('none').onclick = () => setAll(false);
    document.getElementById('reset').onclick = () => {
      checks.forEach((c) => { c.checked = c.value === 'psd'; });
    };
    document.getElementById('close').onclick = () => window.assoc.close();
    document.getElementById('save').onclick = async () => {
      const exts = checks.filter((c) => c.checked).map((c) => c.value);
      document.getElementById('status').textContent = '正在写入关联…';
      await window.assoc.save(exts);
      document.getElementById('status').textContent = '已保存';
      setTimeout(() => { document.getElementById('status').textContent = ''; }, 1600);
    };
    });
  </script>
</body>
</html>
